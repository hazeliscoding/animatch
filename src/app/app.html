<div class="shell">
  <!-- Desktop chrome -->
  <div class="desktop-only">
    <hk-utility-bar [left]="utilLeft" [right]="utilRight" />
    <hk-global-header brand="AniMatch" tagline="for AniList">
      <div class="search-wrap">
        <hk-search-input
          placeholder="Search AniList users"
          (query)="onSearchQuery($event)"
          (search)="onSearchSubmit($event)"
        />
        @if (searchOpen()) {
          <div class="search-results" role="listbox">
            @for (u of searchResults(); track u.id) {
              <button type="button" role="option" class="result" (click)="pickUser(u.name)">
                @if (u.avatar) {
                  <img [src]="u.avatar" alt="" class="r-avatar" />
                } @else {
                  <span class="r-avatar ph">{{ u.name.charAt(0).toUpperCase() }}</span>
                }
                <span class="r-name">{{ u.name }}</span>
                <span class="r-meta">{{ u.completed }} anime</span>
              </button>
            } @empty {
              <div class="result none">No users found</div>
            }
          </div>
        }
      </div>
    </hk-global-header>
    <hk-global-nav [items]="navItems" [active]="activeNav()" />
  </div>

  <!-- Mobile chrome -->
  <div class="mobile-header mobile-only">
    <span class="m-brand">AniMatch</span>
    <span class="m-tagline">for AniList</span>
    <a href="#" class="m-signin" (click)="$event.preventDefault()">Sign in</a>
  </div>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="mobile-nav mobile-only" aria-label="Primary">
    @for (m of mobileNav; track m.label) {
      @if (m.path) {
        <a [routerLink]="m.path" queryParamsHandling="preserve" routerLinkActive="active" class="m-item">
          <span class="glyph">{{ m.glyph }}</span>{{ m.label }}
        </a>
      } @else {
        <a href="#" class="m-item" (click)="$event.preventDefault()">
          <span class="glyph">{{ m.glyph }}</span>{{ m.label }}
        </a>
      }
    }
  </nav>
</div>
